# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI review config for GoldList. Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false

reviews:
  profile: chill
  # Approve the PR once all CodeRabbit comments are resolved.
  # .github/workflows/automerge.yml merges owner PRs as soon as CodeRabbit approves.
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_filters:
    # Generated by scripts/build.py, never edited by hand.
    - "!README.md"
    - "!api/**"
    - "!.github/ISSUE_TEMPLATE/suggest.yml"
  path_instructions:
    - path: "data/**/*.yaml"
      instructions: |
        Each file is one category of GoldList, a curated "best of the best" list of free and
        open-source resources. Review every added or changed entry against this quality bar and
        request changes when it fails:
        - Is it genuinely free, open source, or a useful free tier? Paid-only tools must be rejected.
        - Does the `type` match reality (open-source = public source code; free; free-tier = paid upgrades)?
        - Is it actively maintained? Flag archived GitHub repos or projects that look abandoned.
        - Is it clearly among the best at what it does, and does it fit this category better than another?
        - Is it already listed in another data file (same product, different URL)?
        - `desc` must be one factual line (max 120 chars, ends with a period) that says why it is useful,
          with no marketing hype, unverifiable numbers or first-person text.
        - `url` must be the official homepage or repo over https, with no affiliate, referral or utm params.
        - `github` (optional) must be the project's real owner/repo.
        - `gold: true` is only for the single best one to three entries in a category; question new gold flags.
        - New entries should carry `added: YYYY-MM-DD`.
    - path: "scripts/**/*.py"
      instructions: |
        Build tooling for the list. Keep it dependency-light (stdlib + PyYAML), Python 3.10 compatible.
        Check that validation stays strict and that generated output stays deterministic (no timestamps).
    - path: ".github/workflows/**"
      instructions: |
        Security first: workflows using pull_request_target or issues events must never check out or
        execute pull-request code, and untrusted input (issue bodies, PR titles) must only reach
        scripts through environment variables, never through ${{ }} interpolation inside `run:`.
    - path: "templates/**"
      instructions: |
        README template. Section links must point to category slugs or the static anchors in scripts/build.py.

chat:
  auto_reply: true
