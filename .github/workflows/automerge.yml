name: Auto-merge

# Merges pull requests targeting main automatically once checks pass.
# Supports PRs opened by the repository owner, Dependabot, GitHub Actions, or branches in this repo.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to merge"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main'
        && github.event.pull_request.draft == false
        && (
          github.event.pull_request.head.repo.full_name == github.repository ||
          github.event.pull_request.user.login == github.repository_owner ||
          github.event.pull_request.user.login == 'dependabot[bot]' ||
          github.event.pull_request.user.login == 'app/dependabot' ||
          github.event.pull_request.user.login == 'github-actions[bot]' ||
          github.event.pull_request.user.login == 'app/github-actions' ||
          github.event.label.name == 'approved'
        ))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - name: Wait for checks
        run: |
          echo "Processing PR #$PR for auto-merge..."
          for _ in $(seq 1 30); do
            status=0
            gh pr checks "$PR" >/dev/null 2>&1 || status=$?
            if [ "$status" -eq 0 ] || [ "$status" -eq 8 ]; then break; fi
            sleep 10
          done
          gh pr checks "$PR" --watch --fail-fast --interval 10 || true
      - name: Squash-merge
        run: |
          echo "Squash-merging PR #$PR..."
          gh pr merge "$PR" --squash --delete-branch --admin || gh pr merge "$PR" --squash --delete-branch
          echo "PR #$PR merged successfully!"
      - name: Rebuild README and website
        # Merges made with GITHUB_TOKEN don't trigger push workflows, so start the build explicitly.
        run: |
          gh workflow run build.yml --ref main || true
          gh workflow run pages.yml --ref main || true
