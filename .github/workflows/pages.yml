name: Website

on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "scripts/**", "assets/social-preview.png"]
  schedule:
    - cron: "30 3 * * *" # daily: refresh star counts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build data
        run: python scripts/build.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp api/goldlist.json assets/social-preview.png _site/
      - name: Fetch GitHub stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_stars.py _site/stars.json || echo "::warning::Star counts unavailable; the site works without them."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
