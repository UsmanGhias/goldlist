# Generated by scripts/build.py from data/*.yaml. Do not edit by hand.
name: ⭐ Suggest a resource
description: Something free or open source that belongs on GoldList
title: '[Suggest] '
labels:
- suggestion
body:
- type: markdown
  attributes:
    value: Thanks for helping! A maintainer reviews every suggestion. Once it's labeled `accepted`, a bot adds it to the list automatically.
- type: input
  id: name
  attributes:
    label: Name
    placeholder: e.g. LocalSend
  validations:
    required: true
- type: input
  id: url
  attributes:
    label: Link
    placeholder: https://...
  validations:
    required: true
- type: dropdown
  id: category
  attributes:
    label: Category
    options:
    - Jobs & Freelancing
    - Career & Interviews
    - Scholarships & Research Funding
    - Learning & Courses
    - Students & Programs
    - Developer Tools & Free Tiers
    - AI Tools & Models
    - AI Coding Agents & Tools
    - Claude & Agent Skills
    - MCP Servers
    - Design & UI
    - Video, Audio & Media
    - Productivity & Everyday Apps
    - Research & Writing
    - Startups & Business
    - Privacy & Security
  validations:
    required: true
- type: dropdown
  id: type
  attributes:
    label: Type
    options:
    - Open source
    - Free
    - Free tier
  validations:
    required: true
- type: input
  id: desc
  attributes:
    label: One-line description
    description: Why it's useful, at most 120 characters, ending with a period.
    placeholder: Share files between nearby devices with no internet or account.
  validations:
    required: true
- type: input
  id: github
  attributes:
    label: GitHub repo (optional)
    description: owner/repo, used to show live GitHub stars.
    placeholder: localsend/localsend
- type: textarea
  id: why
  attributes:
    label: Why is it gold?
    description: What makes it the best (or close to it) at what it does?
  validations:
    required: true
- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: It is free, open source, or has a genuinely useful free tier
      required: true
    - label: I searched the list and it is not already on it
      required: true
