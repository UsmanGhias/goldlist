title: Learning & Courses
short: Learning
emoji: 📚
order: 4
description: Free courses and books that are as good as paid ones, often better.
items:
  - name: freeCodeCamp
    url: https://www.freecodecamp.org
    desc: Full-stack curriculum with free certifications and thousands of exercises.
    type: open-source
    github: freeCodeCamp/freeCodeCamp
    gold: true
  - name: CS50x
    url: https://cs50.harvard.edu/x/
