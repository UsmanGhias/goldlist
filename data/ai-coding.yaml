    desc: Google's open-source AI agent for the terminal, with a generous free tier.
    type: open-source
    gold: true
  - name: Codex CLI
    url: https://github.com/openai/codex
    desc: OpenAI's open-source coding agent that runs in your terminal.
    type: open-source
  - name: Aider
    url: https://github.com/Aider-AI/aider
    desc: AI pair programming in your terminal that edits your Git repo directly.
    type: open-source
  - name: Continue
    url: https://github.com/continuedev/continue
    desc: Open-source AI code assistant for VS Code and JetBrains, using any model.
    type: open-source
  - name: OpenHands
    url: https://github.com/OpenHands/OpenHands
    desc: Open-source autonomous software engineering agent.
    type: open-source
  - name: Spec Kit
    url: https://github.com/github/spec-kit
    desc: GitHub's toolkit for spec-driven development that turns specs into plans and tasks for agents.
