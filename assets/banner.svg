<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">GoldList</title>
  <desc id="desc">GoldList: Every elite tool, straight from the source. Curated, open-source, and link-checked weekly.</desc>
  <defs>
    <!-- Paper White Surface Gradient (Freehire Light Theme) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9f6"/>
    </linearGradient>

    <!-- Ambient Gold Radial Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Wordmark Gradient -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#181a14"/>
      <stop offset="45%" stop-color="#12140f"/>
      <stop offset="75%" stop-color="#997000"/>
      <stop offset="100%" stop-color="#c69500"/>
    </linearGradient>

    <!-- Tactile Dot Grid Pattern (Freehire paper dot grid) -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#d9ddd2" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Base Card Rect with Paper Background & Border -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dot-grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#ambient-glow)"/>
  <rect width="1198" height="318" x="1" y="1" rx="19" fill="none" stroke="#e2e5dc" stroke-width="1.5"/>

  <!-- Top Monospace Eyebrow -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <!-- Eyebrow Pill -->
    <rect x="-135" y="-18" width="270" height="28" rx="14" fill="#f2f5ec" stroke="#d5dcce" stroke-width="1"/>
    <circle cx="-112" cy="-4" r="4" fill="#b38600"/>
    <text x="6" y="0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#755700" letter-spacing="2">// THE CURATED DIRECTORY</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(600, 162)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="800" fill="url(#gold-text)" letter-spacing="-2">GoldList</text>
  </g>

  <!-- Subheadline -->
  <text x="600" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#585c50" letter-spacing="0.2">
    Every elite developer tool, AI agent, Claude skill &amp; open-source library. Straight from the source.
  </text>

  <!-- Metric Badges Row (Crisp White Pills with Borders) -->
  <g transform="translate(600, 268)" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500">
    <!-- Tag 1: Verified Picks -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#ffffff" stroke="#d9ded4" stroke-width="1"/>
      <text x="0" y="4" fill="#1b1e16" letter-spacing="1">400+ PICKS</text>
    </g>

    <!-- Tag 2: Categories -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-14" width="160" height="26" rx="13" fill="#ffffff" stroke="#d9ded4" stroke-width="1"/>
      <text x="0" y="4" fill="#1b1e16" letter-spacing="1">16 TOPICS</text>
    </g>

    <!-- Tag 3: Open Source -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#ffffff" stroke="#d9ded4" stroke-width="1"/>
      <text x="0" y="4" fill="#1a7f37" letter-spacing="1">OPEN SOURCE</text>
    </g>

    <!-- Tag 4: Verified Weekly -->
    <g transform="translate(180, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#ffffff" stroke="#d9ded4" stroke-width="1"/>
      <text x="0" y="4" fill="#1b1e16" letter-spacing="1">CI VERIFIED</text>
    </g>

    <!-- Tag 5: License -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-14" width="160" height="26" rx="13" fill="#ffffff" stroke="#d9ded4" stroke-width="1"/>
      <text x="0" y="4" fill="#8a6500" letter-spacing="1">CC0-1.0 PUBLIC</text>
    </g>
  </g>
</svg>
