<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GoldList</title>
  <desc id="desc">GoldList: the best free and open-source resources, curated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110a"/>
      <stop offset="1" stop-color="#2a2110"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e27a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g fill="#d4af37" opacity="0.12">
    <circle cx="1080" cy="60" r="90"/>
    <circle cx="120" cy="260" r="70"/>
  </g>
  <g transform="translate(600 128)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="104" font-weight="700" fill="url(#gold)" letter-spacing="2">GoldList</text>
  </g>
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" fill="#e9dcae" letter-spacing="1">
    Jobs · Career · Scholarships · Learning · Dev Tools · AI · Design
  </text>
  <text x="600" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" fill="#a8996a" letter-spacing="4">
    CURATED · OPEN SOURCE · CHECKED WEEKLY
  </text>
</svg>
